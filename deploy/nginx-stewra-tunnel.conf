# Stewra — served on stewra-server under the Cloudflare tunnel that runs on the router
# (Cloudflare tunnel on the router -> this nginx :8080 -> the stack's loopback container ports).
#
# Install on stewra-server (run as a user with sudo), together with the map snippet it depends on:
#   sudo cp /srv/docker/stewra/deploy/nginx-websocket-map.conf /etc/nginx/conf.d/websocket-map.conf
#   sudo cp /srv/docker/stewra/deploy/nginx-stewra-tunnel.conf /etc/nginx/sites-available/stewra-tunnel
#   sudo ln -sf /etc/nginx/sites-available/stewra-tunnel /etc/nginx/sites-enabled/stewra-tunnel
#   sudo nginx -t && sudo systemctl reload nginx

# NOTE: the `map $http_upgrade $connection_upgrade` this file relies on lives in
# deploy/nginx-websocket-map.conf (a `map` is http-context, so it cannot be defined inside this
# server block). On `home` it used to come for free from the shared `tunnel-access` site — a hidden
# coupling that made this vhost fail `nginx -t` on any host without that site. Install the snippet
# alongside this file, once per host.

server {
    listen 8080;
    server_name www.stewra.com stewra.com;
    client_max_body_size 10M;

    # Website — the static SPA (nginx container on 127.0.0.1:3022).
    location / {
        proxy_pass http://127.0.0.1:3022;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Backend API — the trailing slash on proxy_pass strips the /api/ prefix, so the backend (on
    # 127.0.0.1:3023) sees its own root routes (/auth, /connections, /insights, /messages, …) and the
    # Socket.IO endpoint at /socket.io/ (external /api/socket.io/). The Upgrade/Connection headers +
    # HTTP/1.1 let the WebSocket transport handshake through; without them Socket.IO silently falls
    # back to long-polling only.
    location /api/ {
        proxy_pass http://127.0.0.1:3023/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Long timeout covers both slow AI insight requests and long-lived WebSocket connections
        # (Socket.IO's own ~25s ping keeps an idle socket well under this ceiling).
        proxy_read_timeout 3600s;
        proxy_connect_timeout 75s;
    }
}
