# http-level map required by the WebSocket proxying in nginx-stewra-tunnel.conf: it turns the
# client's `Upgrade` request header into the right `Connection` header for the upstream hop
# (upgrade when a WebSocket is being opened, close otherwise).
#
# Shipped as its own conf.d/ snippet because a `map` is http-context and global. On `home` this
# exact map was provided by the shared `tunnel-access` site (truetalk/rankrise use it too), which
# is why the stewra vhost historically did not define it — and why that vhost silently failed to
# stand alone on a fresh host. On stewra-server nothing else provides it, so it installs here:
#
#   sudo cp /srv/docker/stewra/deploy/nginx-websocket-map.conf /etc/nginx/conf.d/websocket-map.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# If this host ever gains another site that defines the same map, nginx -t fails with a
# duplicate-variable error — delete one copy; the map bodies are identical by convention.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
