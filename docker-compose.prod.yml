# Production deployment artifact for the SSH host (home / 192.168.1.179).
# Lives at /media/WDHD/docker/stewra/ alongside the other apps and is fronted by the host's
# `tunnel-access` nginx (Cloudflare tunnel -> nginx :8080 -> these loopback ports).
#
# This does NOT define Postgres — it reuses the shared `postgres` container (external network
# `postgres_default`, reachable as host `postgres:5432`). Stewra has its own isolated `stewra`
# database + role; set DATABASE_URL in stewra.env to postgresql://stewra:<pw>@postgres:5432/stewra.
#
# Two env files are involved:
#   stewra.env  — backend RUNTIME env (DATABASE_URL, JWT_SECRET, VAULT_KEY, model + Google creds, …)
#   .env        — compose-substitution only; supplies the website's build-time VITE_API_BASE_URL
#
# Deploy (run ON the host, not the dev machine):
#   cd /media/WDHD/docker/stewra
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml run --rm backend node backend/dist/database/migrate.js
#   docker compose -f docker-compose.prod.yml up -d

services:
  # Stewra's OWN coturn (TURN/STUN) — deliberately NOT the shared rankrise-coturn, which runs in
  # use-auth-secret mode with a single global secret (a second realm there couldn't have its own
  # secret). This instance has a distinct realm, secret, ports (3481 / relay 49202-49250), and never
  # touches RankRise/TrueTalk. network_mode: host mirrors rankrise so relay candidates use the real LAN
  # IP. The secret + public IP are injected on the command line (never committed): TURN_STATIC_AUTH_SECRET
  # and TURN_EXTERNAL_IP come from the compose ./.env file; the SAME secret is TURN_SECRET in stewra.env
  # (the backend mints matching HMAC credentials). Gated by CALLS_ENABLED in stewra.env on the app side.
  coturn:
    image: coturn/coturn:latest
    container_name: stewra-coturn
    restart: unless-stopped
    network_mode: host
    command: >-
      -c /etc/coturn/turnserver.conf
      --static-auth-secret=${TURN_STATIC_AUTH_SECRET:?set TURN_STATIC_AUTH_SECRET in ./.env}
      --external-ip=${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP in ./.env}
    volumes:
      - ./deploy/coturn/turnserver-stewra.conf:/etc/coturn/turnserver.conf:ro

  # Redis is REQUIRED by the realtime layer: the Socket.IO adapter (cross-instance room fan-out) and the
  # presence store. Isolated to this stack's own instance; set REDIS_URL=redis://redis:6379 in stewra.env.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - postgres_default

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: stewra-backend:latest
    restart: unless-stopped
    env_file: ./stewra.env
    depends_on:
      - redis
    # Loopback-only; the host nginx proxies /api/ here and strips the prefix.
    ports:
      - "127.0.0.1:3023:3001"
    networks:
      - postgres_default
      # How the backend reaches the provisioner (http://provisioner:3050) to create/start/stop hosted
      # runner containers. Internal-only network — see its definition at the bottom of this file.
      - stewra_internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Persisted media (recorded voice clips + Piper TTS output). Set UPLOADS_DIR=/data/uploads in
    # stewra.env so mediaService writes here; the named volume survives image rebuilds/redeploys.
    volumes:
      - stewra_uploads:/data/uploads
    # The `claude` CLI model provider (MODEL_PROVIDER=claude_cli; CLI installed in backend/Dockerfile)
    # authenticates via CLAUDE_CODE_OAUTH_TOKEN in stewra.env — a long-lived headless token from
    # `claude setup-token`. NO credentials file is mounted: a mounted interactive-login .credentials.json
    # self-destructs on a server (its short-lived access token auto-refreshes, the refresh token rotates
    # and conflicts with the operator's own dev login, and the CLI rewrites the file to a dead state).
    # The setup-token is purpose-built for automation (~1y, no refresh dance), so a fresh writable HOME
    # (/root in the container layer) is all the CLI needs at runtime.

  # Hosted coding-session runners: the provisioner is the only process on this host with the Docker
  # socket, and the backend can reach it only over `stewra_internal`. The backend parses untrusted
  # internet input; if it held the socket, one deserialization bug would be host root. Instead it can
  # ask for "a container for device <uuid>" and nothing else — the hardened template (caps, limits,
  # mounts, network) lives in provisioner/src/template.ts and no request can influence it.
  #
  # PREREQUISITES on the host, before the first `up`:
  #   1. bash deploy/hosted-runner/create-network.sh        (the isolated stewra_runners network)
  #   2. sudo bash deploy/hosted-runner/iptables-egress.sh  (fence it off the LAN — and persist it)
  #   3. build + tag the runner image this provisioner is pinned to (RUNNER_IMAGE in provisioner.env)
  #   4. write provisioner.env (PROVISIONER_TOKEN, DOCKER_SOCKET, RUNNER_IMAGE, RUNNER_NETWORK,
  #      RUNNER_MEMORY_BYTES, RUNNER_NANO_CPUS, RUNNER_PIDS_LIMIT — all required, it refuses to boot
  #      without them). The same token goes in stewra.env as HOSTED_RUNNER_PROVISIONER_TOKEN.
  # Behind the `hosted` profile, so a deploy that has not done the four steps above is unaffected:
  # a plain `docker compose up -d` never builds, starts, or even resolves this service, and the
  # backend's HOSTED_RUNNER_ENABLED defaults to false. Start it with `--profile hosted`, at which
  # point provisioner.env becomes required and its absence stops the deploy — which is correct, since
  # a provisioner with no configuration must not run.
  provisioner:
    profiles: ["hosted"]
    build:
      context: .
      dockerfile: provisioner/Dockerfile
    image: stewra-provisioner:latest
    restart: unless-stopped
    env_file: ./provisioner.env
    # NO published ports. Nothing outside this compose project can address it.
    networks:
      - stewra_internal
    volumes:
      # The socket, and nothing else. Read-write because creating containers requires it; :ro would
      # be theatre (the Docker API is a socket protocol, not a filesystem).
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      # Fails when the daemon stops answering, which is exactly when hosted runners are unmanageable.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3050/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  website:
    build:
      context: .
      dockerfile: website/Dockerfile
      args:
        # Baked into the SPA at build time. Fails loud if unset (see website/Dockerfile).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL in ./.env}
    image: stewra-website:latest
    restart: unless-stopped
    depends_on:
      - backend
    # Loopback-only; the host nginx proxies / here.
    ports:
      - "127.0.0.1:3022:80"

networks:
  # The shared Postgres container's network, created by the postgres stack.
  postgres_default:
    external: true
  # backend <-> provisioner only. `internal: true` means Docker gives it no gateway at all, so even
  # if the provisioner's token leaked, there is no route from the outside world to reach it — and no
  # route from the provisioner out. Note this is NOT the network runner containers live on; that one
  # is created outside compose by deploy/hosted-runner/create-network.sh and is never joined here.
  stewra_internal:
    internal: true

volumes:
  # Owner-scoped media store (voice-in clips + TTS-out WAVs), served only via authenticated GET /media/:id.
  stewra_uploads:
