# Packaging config for the Stewra Bridge desktop app.
#
# Produces installable artifacts per OS. Build each platform's target ON that OS (electron-builder can
# only build macOS .dmg on macOS); this repo verifies the Linux targets. Windows is not a target yet —
# no Windows machine to build or test on; the download page shows it as "coming soon".
#
# macOS artifacts ARE signed here, with the Developer ID cert from the build machine's login keychain
# (see `mac.identity` below); notarization is a separate step, scripts/notarize-dmg.sh. Linux targets
# are unsigned. Build the mac target via `npm run package:mac`, never by invoking
# electron-builder directly — the wrapper guards a filesystem trap documented in scripts/package-mac.sh.
appId: com.stewra.bridge
productName: Stewra Bridge
copyright: Stewra

# The Electron version comes from the installed `electron` devDependency (electron-builder reads the
# resolved package). Never pin `electronVersion` here — a pin silently drifts from the lockfile and
# ships a different runtime than the one developed and tested against.

directories:
  # NOT `dist` — that is the TypeScript compiler's output; installers go somewhere separate.
  output: release
  buildResources: build

# Keep the scoped npm name (@stewra/bridge) out of artifact filenames — the "/" and "@" break paths.
# Hyphenated LITERAL, not ${productName}: "Stewra Bridge-1.1.0-arm64.zip" contains a space, GitHub
# rewrites spaces to dots in release-asset names, and then the URL electron-updater builds from
# latest-mac.yml no longer matches any asset. No spaces means the yml and the assets can't diverge.
artifactName: Stewra-Bridge-${version}-${arch}.${ext}

# Where UPDATES are looked for at runtime: electron-builder bakes this into the packaged app's
# app-update.yml, which electron-updater reads. Every build still runs `--publish never` (see the
# package scripts and package-mac.sh) — publishing a release stays a manual `gh release create` after
# notarization, per scripts/package-release.mjs. Only non-prerelease releases may carry bridge
# artifacts, and each must include latest-mac.yml / latest-linux.yml (enforced in package-release.mjs);
# a partial release (e.g. runner-only) must be marked --prerelease so `releases/latest` skips it.
publish:
  provider: github
  owner: charanstyle
  repo: Stewra

# `main` in package.json (dist/main/main.js) is the entry; electron-builder includes the compiled
# app plus production dependencies automatically and prunes devDependencies. We only need to keep the
# TypeScript sources and configs out of the shipped asar.
files:
  - '**/*'
  - '!**/*.ts'
  - '!tsconfig*.json'
  - '!electron-builder.yml'
  - '!scripts/**'
  # Exclude the output dir EXPLICITLY. electron-builder does this implicitly, but only while `output`
  # resolves inside this package — and scripts/package-mac.sh deliberately moves it out (see there).
  # Without this line that build packs the previous release/ INTO the new app.asar: 24 MB -> 396 MB,
  # app bundle 293M -> 611M, dmg 102 MB -> 307 MB. Silent; nothing fails, the artifact is just huge.
  - '!release/**'
  # AppleDouble sidecars, which macOS scatters on filesystems that can't store xattrs natively. Junk
  # in the asar rather than a correctness problem — the signature-breaking ones appear in the OUTPUT
  # bundle, not here, and are handled by scripts/package-mac.sh.
  - '!**/._*'

# Baileys / socket.io-client / zod are pure JS — no native addons to rebuild against Electron's ABI.
npmRebuild: false

# License terms travel with the installed app (Contents/Resources on macOS, resources/ on Linux).
# The download page and the GitHub release carry the same files.
extraResources:
  - from: ../LICENSE
    to: LICENSE
  - from: ../EULA.md
    to: EULA.md

linux:
  # The npm package is scoped (@stewra/bridge); an executable/file name can't contain "@" or "/".
  executableName: stewra-bridge
  target:
    - deb
    - AppImage
  category: Network
  maintainer: Stewra <noreply@stewra.com>
  icon: build/icon.png

mac:
  # dmg is what users download; zip is what electron-updater applies (Squirrel.Mac cannot update from
  # a dmg — without the zip, macOS auto-update silently never happens). Both are built in PASS 2 of
  # scripts/package-mac.sh from the already-notarized, stapled .app.
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  icon: build/icon.png
  # Sign with the org's "Developer ID Application" certificate. This is the ONLY signature type macOS
  # will notarize for distribution outside the App Store; with a stapled notarization ticket, users get a
  # clean double-click (no Gatekeeper prompt at all). An ad-hoc seal ("-") only downgrades the hard
  # "damaged" block to the "unidentified developer / Open Anyway" gate — acceptable as a stopgap but not
  # for real users. The cert's private key lives in the Mac build machine's login keychain, so the mac
  # target must be built in an interactive login session there (codesign can't reach the key over SSH).
  # NB: give the cert common-name WITHOUT the "Developer ID Application:" prefix — electron-builder adds
  # the type itself and picks the matching Developer ID Application cert automatically.
  identity: 'Nurturing Lab Limited Company (35JR7LFXPF)'
  # Notarization REQUIRES the hardened runtime. electron-builder applies its default mac entitlements
  # (allow-jit / allow-unsigned-executable-memory / disable-library-validation) which Electron needs to
  # launch under hardened runtime — so no custom entitlements file is required here.
  hardenedRuntime: true
  # Don't let electron-builder run its own Gatekeeper assessment mid-build; the app isn't notarized yet
  # at sign time (we notarize + staple the .dmg afterward with `xcrun notarytool` / `stapler`).
  gatekeeperAssess: false
  # NOTE: notarization is a SEPARATE post-build step (notarytool submit --wait → stapler staple the .dmg),
  # driven by scripts/notarize-dmg so a contributor without notary credentials can still produce a signed
  # (un-notarized) build. See bridge/scripts/notarize-dmg.sh.
