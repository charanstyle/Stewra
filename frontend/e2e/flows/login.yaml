# Sign in to the Stewra app with credentials supplied via env.
#
# Credentials are injected at run time by run-features.sh as `--env EMAIL=... --env PASSWORD=...`
# (sourced from the repo-root .env.e2e). They are deliberately NOT declared with defaults here:
# Maestro 2.6.x lets a flow-level `env:` default win over the command-line `--env`, so a default
# would clobber the injected credential and the flow would type an empty string. run-features.sh
# fails loudly when the credentials are missing, so the "never sign in as a blank/wrong user"
# guarantee lives there, not in a placeholder default.
appId: com.stewra.app
---
- launchApp:
    clearState: true          # start from a signed-out state every run
# Wait, don't sample: a Release build has to load and evaluate the embedded JS bundle after launch,
# which takes a second or two on a cold start. A bare `assertVisible` runs the instant launchApp
# returns and fails against a splash screen that is about to render fine.
#
# `optional: true` because on iOS this wait legitimately does NOT succeed: `clearState` wipes the app
# container but NOT the Keychain, and expo-secure-store keeps the session token there — so the app
# relaunches already signed in, on Chats. (Android's `pm clear` does drop everything, so there the
# app really is signed out and this wait is the one that resolves.) The sign-out branch below absorbs
# the difference, and the hard `assertVisible` after it is what actually fails the flow if neither
# screen arrived.
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 30000
    optional: true
# Signed-in detection is by the Chats tab's testID, not its label: since the Today tab became the
# landing screen, "Chats" only appears as a tab-bar label, and iOS composes those into
# "Chats, tab, 2 of 6" — a full-string text match never hits it. The testID surfaces as a plain
# resource-id on both platforms.
- runFlow:
    when:
      visible:
        id: "tab-chats"
    commands:
      - tapOn:
          id: "logout-btn"
      - extendedWaitUntil:
          visible: "Sign in"
          timeout: 20000
- assertVisible: "Sign in"
- tapOn:
    id: "login-email-input"
- inputText: ${EMAIL}
- tapOn:
    id: "login-password-input"
- inputText: ${PASSWORD}
# Dismiss the keyboard before submitting: on shorter screens / taller keyboards the "Sign in"
# button sits behind the soft keyboard, so a tap on it would land on a key instead of the button.
#
# ANDROID ONLY. Maestro implements `hideKeyboard` on iOS as a tap outside the keyboard, and on this
# screen that tap lands on the "Forgot password?" link — the flow navigated to Reset password, so
# `login-submit` was genuinely gone. iOS doesn't need the dismissal anyway: `login-submit` is above
# the keyboard and tappable with it up.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "login-submit"
# iOS raises a "Save Password?" system alert after a successful credential submit. It belongs to
# another process, but Maestro's iOS hierarchy DOES expose it (`accessibilityText: "Not Now"` with
# bounds), so it is dismissable — verified live on Stewra-iPhone17 / iOS 26.3. Left up, it covers the
# app and the "Chats" wait below times out even though the sign-in itself succeeded, which is exactly
# how the two-party call runner failed with a misleading "caller login failed".
#
# Suppressing it at the source does not work: `simctl spawn <udid> defaults write com.apple.Preferences
# AutoFillPasswords -bool false` leaves the alert appearing anyway. So dismiss it here instead.
#
# The wait is `optional` because the alert is not guaranteed — iOS suppresses it once the credential
# is already stored — and the tap is `optional` for the same reason. Neither is load-bearing: the hard
# "Chats" assertion below is what decides whether the sign-in worked.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            text: "Not Now"
          timeout: 8000
          optional: true
      - tapOn:
          text: "Not Now"
          optional: true
# Android has the same trap with different chrome: Google Password Manager raises a "Save password
# to Google Password Manager" bottom sheet after the submit, and it covers the whole app — every
# later assertion (and even the NEXT flow's "Sign in" wait, since the sheet outlives clearState's
# target) fails behind it. Its dismiss button is "Not now" (lowercase n, unlike iOS's "Not Now").
# Optional twice over, like the iOS branch: GPM suppresses the sheet once "never save" is
# remembered, and QA devices may have the autofill service disabled entirely.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            text: "Not now"
          timeout: 8000
          optional: true
      - tapOn:
          text: "Not now"
          optional: true
# Landing on the main tab bar proves the token was issued and the user is verified. Matched by
# testID for the same iOS tab-label reason as the signed-in branch above.
- extendedWaitUntil:
    visible:
      id: "tab-chats"
    timeout: 20000
